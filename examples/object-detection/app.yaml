apiVersion: v1
kind: Application

metadata:
  id: object_detection
  name: Object Detection
  version: 1.0.0
  description: Real-time object detection and tracking
  author: NeoRuntime Team
  email: opensource@camthink.ai

spec:
  image: registry.local/object-detection:1.0.0
  
  resources:
    cpu: "50%"
    memory: "256Mi"
    
  permissions:
    video:
      - cam0_main.raw
    
    inference:
      models:
        - person_vehicle_v1
      max_qps: 30
      max_concurrent: 2
    
    events:
      publish:
        - app/object_detection/*
      subscribe:
        - model/*/detections
        - system/temperature
    
    device:
      light: true
      ir_cut: false
      ptz: false
      lens: false
    
    network:
      outbound: []
  
  env:
    - name: CONFIDENCE_THRESHOLD
      value: "0.7"
    - name: FPS_LIMIT
      value: "15"
  
  volumes:
    - host: /data/aipc/logs/object_detection
      container: /app/logs
      readonly: false
  
  autostart: true
  restart_policy: on-failure
  restart_max_retries: 3
  
  healthcheck:
    enabled: true
    interval: 30s
    timeout: 5s
    retries: 3
