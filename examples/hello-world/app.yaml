# Hello World Application Manifest
# Minimal example for testing the NeoRuntime platform

apiVersion: v1
kind: Application

metadata:
  id: hello-world
  name: Hello World
  version: 1.0.0
  description: A simple hello world application that prints continuously
  author: NeoRuntime Team

spec:
  # Container image
  image: neoruntime/hello-world:1.0.0

  # Minimal resource limits
  resources:
    cpu: "10%"
    memory: "32Mi"

  # Startup configuration
  autostart: false
  restart_policy: on-failure
  restart_max_retries: 3
