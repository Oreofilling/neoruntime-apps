# 03-single-inference — rung 3 of the examples ladder: first inference.
#
# The model dependency is declarative: app-manager registers +
# authorizes it at install time (a device that already has the id uses
# its own copy) and injects the resolved id as AIPC_MODEL_detector.
# Contrast rung 04, which registers at runtime instead.
# See examples/README.md for the whole ladder.

apiVersion: v1
kind: Application

metadata:
  id: single-inference
  name: Single Inference (ladder 03)
  version: 1.0.0
  description: One-shot example - first inference result from a declared model, then exit
  author: NeoRuntime Team

spec:
  image: neoruntime/single-inference:1.0.0

  resources:
    cpu: "25%"
    memory: 256Mi

  # Declarative model dependency: bundled in the image (models/, fetched
  # by scripts/fetch_models.sh, sha256-pinned via models.manifest). The
  # manifest filename doubles as the model id.
  models:
    detector:
      id: yolov8n
      path: /opt/aipc/models/yolov8n.hef
      type: detection
      required: true

  permissions:
    video:
      - main.raw
      - sub.raw
    inference:
      max_qps: 10
      max_concurrent: 1

  env:
    - name: STREAM_ID
      value: "main"
    - name: MIN_SCORE
      value: "0.3"

  autostart: false
  restart_policy: never
