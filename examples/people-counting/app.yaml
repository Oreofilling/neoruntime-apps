apiVersion: v1
kind: Application

metadata:
  id: people_counting
  name: People Counting
  version: 1.0.1
  description: Count people in the scene and send alerts when threshold exceeded
  author: NeoRuntime

spec:
  image: neoruntime/people-counting:1.0.1

  resources:
    cpu: "50%"
    memory: "256Mi"

  # Model dependencies — bundled in the image (models/, fetched from the
  # pinned Hailo model zoo compile) so installs are plug-and-play. The id is
  # auto-authorized for inference; the resolved id is injected at runtime as
  # AIPC_MODEL_detector. A device that already has the id uses its own copy.
  # (spec.models no longer declares a postprocess type: bundled models take
  # it from AMPK package metadata or the device's existing model row.)
  models:
    detector:
      id: person_v1
      path: /opt/aipc/models/person_v1.bin
      required: true

  permissions:
    video:
      - main.raw
      - sub.raw

    inference:
      max_qps: 10

    events:
      publish:
        - app/people_counting/*
      subscribe:
        - model/*/detections

    device:
      light: true

  env:
    # Devices expose main/sub streams (dev rigs used cam0_main; app.py keeps
    # that as the env-unset default).
    - name: STREAM_ID
      value: "main"
    - name: THRESHOLD
      value: "10"

  volumes:
    - host: /data/aipc/logs/people_counting
      container: /app/logs
      readonly: false

  autostart: false
  restart_policy: on-failure
  restart_max_retries: 3
