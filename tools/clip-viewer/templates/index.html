<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIP Zero-Shot Viewer</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e6ed;
    --text-dim: #8b8fa3;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --success: #00cec9;
    --danger: #ff6b6b;
    --bar-bg: #2a2d3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  .status-badge {
    font-size: 12px; padding: 4px 10px; border-radius: 12px;
    background: var(--border); color: var(--text-dim);
  }
  .status-badge.connected { background: rgba(0,206,201,0.15); color: var(--success); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Label management */
  .label-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .label-input-row input {
    flex: 1; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
  }
  .label-input-row input:focus { border-color: var(--accent); }
  .btn {
    padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-light); }

  .label-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .label-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px;
  }
  .label-tag .remove {
    cursor: pointer; color: var(--text-dim); font-size: 16px; line-height: 1;
  }
  .label-tag .remove:hover { color: var(--danger); }

  /* Results */
  .result-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .result-row:last-child { border-bottom: none; }
  .result-rank {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    background: var(--border); color: var(--text-dim);
  }
  .result-row:first-child .result-rank { background: var(--accent); color: #fff; }
  .result-label { flex: 1; font-size: 14px; font-weight: 500; }
  .result-bar-wrap { width: 180px; height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
  .result-bar {
    height: 100%; border-radius: 4px; transition: width 0.3s ease;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
  }
  .result-score { width: 60px; text-align: right; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat-item { text-align: center; padding: 12px; background: var(--bg); border-radius: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--accent-light); }
  .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .no-data {
    text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .result-bar-wrap { width: 100px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>CLIP Zero-Shot Viewer</h1>
    <span id="statusBadge" class="status-badge">Connecting...</span>
  </header>

  <!-- Label Management -->
  <div class="card">
    <h2>Text Labels</h2>
    <div class="label-input-row">
      <input type="text" id="labelInput" placeholder='Enter label, e.g. "a person", "a dog"' />
      <button class="btn btn-primary" onclick="addLabel()">Add</button>
    </div>
    <div class="label-tags" id="labelTags"></div>
  </div>

  <!-- Classification Results -->
  <div class="card">
    <h2>Classification Results</h2>
    <div id="resultsContainer">
      <div class="no-data">Waiting for inference results...</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="card">
    <h2>Statistics</h2>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-value" id="statFrames">0</div>
        <div class="stat-label">Frames</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statTopLabel">-</div>
        <div class="stat-label">Top Match</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statTopScore">-</div>
        <div class="stat-label">Top Score</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statUptime">0s</div>
        <div class="stat-label">Uptime</div>
      </div>
    </div>
  </div>
</div>

<script>
  let labels = [];
  let connected = false;
  let startTime = Date.now();
  let eventSource = null;

  // --- Label Management ---
  function renderLabels() {
    const el = document.getElementById('labelTags');
    el.innerHTML = labels.map((l, i) =>
      `<span class="label-tag">${escapeHtml(l)}<span class="remove" onclick="removeLabel(${i})">&times;</span></span>`
    ).join('');
  }

  function addLabel() {
    const input = document.getElementById('labelInput');
    const val = input.value.trim();
    if (!val) return;
    if (labels.includes(val)) return;
    if (labels.length >= 20) { alert('Maximum 20 labels'); return; }
    labels.push(val);
    input.value = '';
    renderLabels();
    pushLabels();
  }

  function removeLabel(index) {
    labels.splice(index, 1);
    renderLabels();
    pushLabels();
  }

  function pushLabels() {
    fetch('/api/labels', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({labels: labels})
    }).catch(() => {});
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Enter key support
  document.getElementById('labelInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addLabel();
  });

  // --- Results Rendering ---
  function renderResults(data) {
    const container = document.getElementById('resultsContainer');
    if (!data.results || data.results.length === 0) {
      container.innerHTML = '<div class="no-data">Waiting for inference results...</div>';
      return;
    }
    const maxScore = Math.max(...data.results.map(r => r.display_score));
    container.innerHTML = data.results.map((r, i) => {
      const pct = maxScore > 0 ? (r.display_score / maxScore * 100) : 0;
      return `<div class="result-row">
        <div class="result-rank">${i + 1}</div>
        <div class="result-label">${escapeHtml(r.label)}</div>
        <div class="result-bar-wrap"><div class="result-bar" style="width:${pct}%"></div></div>
        <div class="result-score">${r.display_score.toFixed(1)}%</div>
      </div>`;
    }).join('');
  }

  function updateStats(data) {
    document.getElementById('statFrames').textContent = data.frame_count || 0;
    document.getElementById('statTopLabel').textContent = data.top_label || '-';
    document.getElementById('statTopScore').textContent = data.top_score ? data.top_score.toFixed(3) : '-';
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('statUptime').textContent = m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  // --- SSE Connection ---
  function connectSSE() {
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/api/stream');

    eventSource.onopen = function() {
      connected = true;
      document.getElementById('statusBadge').textContent = 'Connected';
      document.getElementById('statusBadge').className = 'status-badge connected';
    };

    eventSource.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data);
        renderResults(data);
        updateStats(data);
      } catch (e) {}
    };

    eventSource.onerror = function() {
      connected = false;
      document.getElementById('statusBadge').textContent = 'Reconnecting...';
      document.getElementById('statusBadge').className = 'status-badge';
      setTimeout(connectSSE, 3000);
    };
  }

  // --- Init ---
  fetch('/api/labels')
    .then(r => r.json())
    .then(data => {
      labels = data.labels || [];
      renderLabels();
    })
    .catch(() => {});

  connectSSE();

  // Periodic stats update
  setInterval(function() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('statUptime').textContent = m > 0 ? `${m}m ${s}s` : `${s}s`;
  }, 1000);
</script>
</body>
</html>
