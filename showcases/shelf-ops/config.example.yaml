# ---- counting mode -----------------------------------------------------------
# slot_mode selects how goods are counted (docs/device-gate.md §8):
#   slots — calibrated planogram polygons above; per-slot FULL/EMPTY + tilt
#   grid  — ONE big region (path A: "draw a box over the whole screen and
#           count the goods inside"). The region is tiled rows x cols virtual
#           cells, each classified by the same CLIP engine; goods in frame =
#           occupied cells (GOODS n/N on the overlay + topbar Goods stat).
#           "slots:" above is ignored in grid mode.
# Grid cells are classified serially (~48 ms each on device): 3x4=12 cells
# takes ~0.6 s per scan; rows*cols is capped at 144. Region is normalized
# [x1, y1, x2, y2]. Env overrides: SLOT_MODE, GRID_ROWS, GRID_COLS.
#
# slot_mode: grid
# grid:
#   region: [0.0, 0.0, 1.0, 1.0]   # full frame; shrink to crop a table/sofa
#   rows: 3
#   cols: 4
#   show_cells: false              # one-shelf view: hide cell borders/chips
#                                   # (render-only; cells still drive GOODS)

# ---- vocabulary overrides (optional; defaults in config.py) ----
# Each code maps to ONE CLIP text prompt; the slot crop is classified by
# cosine similarity against "a photo of {prompt}" (ENCODE_TEMPLATE). The
# special EMPTY code is the vacancy prompt. Changing the vocabulary rebuilds
# the cached text embeddings on next boot (vocab_embeddings_f32.npy).
# vocabulary:
#   A:
#     label_cn: "瓶装水"
#     label: "bottled water"
#     prompt: "a clear plastic bottle of water"
#   EMPTY:
#     label_cn: "空位"
#     label: "empty shelf"
#     prompt: "empty supermarket shelf with no products"
