# ShelfOps configuration overlay — template (copy to config.yaml on device:
# /data/aipc/etc/shelf-ops/config.yaml)
#
# Loaded by config.py as a YAML overlay on top of environment variables.
# Slots (shelf positions) and the vocabulary are site-specific and defined
# here because polygons / prompts cannot be set via env.
#
# Coordinate system: normalized [0,1] where (0,0) is top-left, (1,1) is
# bottom-right of the camera frame.
#
# Recognition is slot-anchored CLIP (docs/device-gate.md §7): each slot's
# polygon crop is classified against the vocabulary text prompts, so
# "capacity" is binary per slot — provision capacity 1 slots. A slot holding
# its product reads FULL, the vacancy prompt reading EMPTY.

# ---- shelf slots (2 rows x 5 columns demo planogram; matches defaults) ----
# expected_code = planogram guidance ("plan X" chip + tilted detection when
# the recognized code differs). Delete the whole "slots:" block to fall back
# to the built-in default grid.
slots:
  - id: "s1"
    name: "1-1 Shelf"
    expected_code: "A"
    capacity: 1
    polygon:
