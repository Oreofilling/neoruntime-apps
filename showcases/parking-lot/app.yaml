# NeoRuntime Platform Application Manifest
# Parking Lot Full Element Extraction

apiVersion: v1
kind: Application

metadata:
  id: parking_lot
  name: Parking Lot Full Element Extraction
  version: 1.2.2
  description: "Parking-lot element extraction with vehicle attributes, depth anti-spoofing, and plate OCR."
  author: NeoRuntime Team
  email: opensource@camthink.ai

spec:
  image: neoruntime/parking-lot:1.2.2

  resources:
    cpu: "200%"
    memory: "2Gi"

  # Model dependencies bundled in the image (models/) so installs are
  # plug-and-play, each declared as an AMPK .bin package (exported from the
  # platform model row). Resolution order at install: when the id already
  # exists on the device the platform copy wins and the bundle is only hash
  # compared; on a fresh device app-manager unpacks the package into a
  # transient registration whose mode comes from the package metadata:
  # yolov8n_vehicle_det (since 1.2.2, replaces yolov5m_vehicles as the
  # vehicle detector — 640x384 NV12 input, ~38ms/frame vs ~1.2s for the
  # 1080p RGB chain) pins the hailo_yolov8n_384_640 postprocess profile
  # whose default hailo_yolov8n backend matches this HEF's NMS tensor, so
  # the preload registration is already correct and the app's startup
  # registration keeps it (only re-applying its variant blob would change
  # thresholds; a mis-configured incumbent is still force-replaced — see
  # parking_lot/app.py register_models);
  # license_plate_det registers raw (the app decodes the yolov4 grid
  # itself — the default detection profile pinned in its package config
  # is ignored on the raw path); plate_recognition registers
  # ocr_recognition.
  # yolov5m_vehicles is gone from spec.models AND permissions on purpose:
  # preload walks permissions.inference.models and would 6002-fail on
  # fresh devices for an id with neither a platform row nor a bundle.
  # Its .hef stays vendored in the image and MODEL_DEFS keeps the entry,
  # so switching back for an A/B only needs the device row + permission.
  models:
    vehicle:
      id: yolov8n_vehicle_det
      path: /opt/aipc/models/yolov8n_vehicle_det.bin
      required: true
    depth:
      id: scdepthv3
      path: /opt/aipc/models/scdepthv3.bin
      required: true
    plate_det:
      id: license_plate_det
      path: /opt/aipc/models/license_plate_det.bin
      required: true
    plate_rec:
      id: plate_recognition
      path: /opt/aipc/models/plate_recognition.bin
      required: true

  permissions:
    video:
      - sub.raw

    inference:
      models:
        - yolov8n_vehicle_det
        - scdepthv3
        - license_plate_det
        - plate_recognition
      max_qps: 25
      max_concurrent: 4
      allow_register_model: true

    events:
      publish:
        - parking/vehicles
        - parking/plates
        - parking/alerts
      subscribe:
        - system/*

    device:
      light: false
      ir_cut: false
      ptz: false
      lens: false

    network:
      mode: host

  env:
    - name: PARKING_CONFIG
      value: "/data/aipc/etc/parking-lot.yaml"
    - name: STREAM_ID
      value: "sub"
    - name: TARGET_FPS
      value: "20"
    - name: VEHICLE_MODEL
      value: "yolov8n_vehicle_det"
    - name: DEPTH_MODEL
      value: "scdepthv3"
    - name: PLATE_DET_MODEL
      value: "license_plate_det"
    - name: PLATE_REC_MODEL
      value: "plate_recognition"
    - name: DEPTH_SPOOF_THRESHOLD
      value: "0.02"
    # DSP hardware offload (keep_fd + resize_hw/multi_crop_hw) for model-input
    # scaling and plate letterbox tiles. Set 0 to force the pure-CPU pipeline
    # for on-device A/B comparisons.
    - name: PARKING_LOT_DSP
      value: "1"
    - name: LOG_LEVEL
      value: "info"
    # HD 1080P MSE preview reuses platform-api's hardware H.264 stream
    # (ws://<lan-ip>:<port>/api/v1/h264/main). Default 8080 = platform-api
    # http_addr (configs/platform-api.yaml). Set HD_PREVIEW_ENABLED=0 to fall
    # back to MJPEG. If platform-api enables token auth, inject PLATFORM_API_TOKEN
    # at runtime (never commit a real token here).
    - name: PLATFORM_API_PORT
      value: "8080"
    - name: HD_PREVIEW_ENABLED
      value: "1"
    - name: PLATFORM_API_TOKEN
      value: "${AIPC_TOKEN_KEY}"

  volumes:
    - host: /data/aipc/models
      container: /data/aipc/models
      readonly: true
    - host: /data/aipc/logs/parking_lot
      container: /app/logs
      readonly: false

  autostart: false
  restart_policy: on-failure
  restart_max_retries: 3

  healthcheck:
    enabled: true
    interval: 30s
    timeout: 5s
    retries: 3
