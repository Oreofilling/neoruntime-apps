# GymOps configuration overlay — deployed to /data/aipc/etc/gym-ops/config.yaml
#
# This file is loaded by config.py as a YAML overlay on top of environment
# variables. Zones and equipment are defined here because their polygon
# coordinates and capacities are site-specific and cannot be set via env.
#
# Coordinate system: normalized [0,1] where (0,0) is top-left, (1,1) is
# bottom-right of the camera frame.

# ---- zones (counted for occupancy + crowd alerts) ----
# Optional per-zone keys:
#   color: "#rrggbb"  — override the identity color used by the video overlay
#                       badge and the sidebar row (default: low-saturation
#                       palette assigned by config order, cycling through
#                       #6ea8ff #3ecf8e #f5b342 #b48cff #4cc3d9 #ff8f6b)
#   forbidden: true   — staff-only zone; drawn amber with a dashed border
zones:
  # Per-machine layout from snapshot 2026-08-24: one zone per machine,
  # identical machines grouped (4 treadmills, 2 bikes). Boxes wrap where
  # the user's body_center sits while using the machine; walkways between
  # machines stay unassigned. Background machines (cable/Smith) overlap
  # the foreground platform/treadmill row in screen space, resolved by
  # the x=0.42 and y=0.45 seams (standing-at-machine above/left,
  # on-platform below). The platform zone tapers with floor perspective.
  - id: "z1"
    name: "Treadmill Zone"
    capacity: 4
    polygon:
      - [0.145, 0.16]
      - [0.42, 0.16]
      - [0.42, 0.36]
      - [0.145, 0.36]

  - id: "z2"
    name: "Stair Climber Zone"
    capacity: 1
    polygon:
      - [0.00, 0.26]
      - [0.135, 0.26]
      - [0.135, 0.74]
      - [0.00, 0.74]

  - id: "z3"
    name: "Bike Zone"
    capacity: 2
    polygon:
      - [0.14, 0.36]
      - [0.315, 0.36]
      - [0.315, 0.67]
      - [0.14, 0.67]

  - id: "z4"
    name: "Cable Machine Zone"
    capacity: 1
    polygon:
      - [0.42, 0.11]
      - [0.51, 0.11]
      - [0.51, 0.45]
      - [0.42, 0.45]

  - id: "z5"
    name: "Smith Machine Zone"
    capacity: 1
    polygon:
      - [0.51, 0.11]
      - [0.655, 0.11]
      - [0.655, 0.45]
      - [0.51, 0.45]

  - id: "z6"
    name: "Lifting Platform Zone"
    capacity: 2
    polygon:
      - [0.36, 0.45]
      - [0.71, 0.45]
      - [0.72, 0.89]
      - [0.32, 0.89]

  - id: "z7"
    name: "Dumbbell Zone"
    capacity: 2
    polygon:
      - [0.72, 0.34]
      - [0.93, 0.34]
      - [0.93, 0.78]
      - [0.72, 0.78]

# ---- equipment (tracked for occupancy + long-usage alerts) ----
# Bboxes matched to the machines actually visible in the camera view
# (snapshot 2026-08-24): treadmill row + cardio on the left wall,
# cable + Smith behind the lifting platform, dumbbell rack right.
equipment:
