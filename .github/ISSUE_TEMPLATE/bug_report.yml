name: Bug report
description: Something in an app or the build tooling does not behave as documented
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - examples ladder (01-07)
        - sdk-teaching-demo
        - a showcase (parking-lot / model-showcase / shelf-ops / gym-ops)
        - templates/basic
        - build / packaging (build_app.sh, .neoapp)
        - other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / commit
      placeholder: "e.g. parking-lot 1.2.5, or commit abc1234"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead. Logs via `aipc-cli app logs <id>` help a lot.
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: neoruntime-ipc-sdk version
      placeholder: python -c "import neoruntime_ipc_sdk as s; print(s.__version__)"
